# This plugin has no build step and no dependencies: audit.py is stdlib-only so
# it runs under whatever bare `python3` the repo under audit happens to have.
# There is deliberately no [project] table — this file exists to configure the
# linters, and to give the `# noqa` directives in the source something to mean.
#
# Note for anyone reaching for uv here: the mere presence of this file makes
# `uv run` treat the directory as a project and write a uv.lock that locks
# nothing, with requires-python taken from whichever interpreter you happened to
# invoke rather than this script's real 3.11 floor. Use `uv run --no-project`,
# which is the only thing that suppresses it — `[tool.uv] managed = false` does
# not (tested). The stray lockfile is gitignored either way.

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"        # tomllib
line-length = 100
# The ruff replay fixture is deliberately mis-formatted Python inside Markdown
# fences: it is the input whose reformatting the test measures. Tidied, the test
# would pass against a fixture with nothing left to find — the evidence erased by
# the tool it is evidence about.
#
# This setting is not what prevents that. It governs ruff's own discovery, so a
# bare `ruff format .` skips the fixtures; it does **not** reach the pre-commit
# hook, which passes filenames explicitly and resolves config per file, and
# `integration/fixtures/ruff-md-fences/pyproject.toml` shadows this file for
# everything under that directory. Measured: with the nearest config,
# `ruff format --check --force-exclude <fixture>.md` reformats; forced to this
# one via `--config pyproject.toml` it reports no files. The hook-level
# `exclude:` in .pre-commit-config.yaml is what actually protects them (#107).
extend-exclude = ["integration/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RUF",      # ruff's own rules
    # The whole job of this script is fetching URLs and comparing what comes
    # back, so the security rules are the relevant ones -- and S310 in
    # particular is already annotated in the source. Without S selected that
    # annotation silences nothing while reading as a considered decision.
    "S",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how a test asserts.
# E501: the lockfile fixture embeds a real-shaped URL and a 64-character sha256
#       in one TOML inline table, which the format does not allow wrapping.
#       Line length there is a property of the data, not of authored prose.
# S603/S607: the gate_diff tests build throwaway git repos to run against, which
#       means invoking `git` from PATH. Same call shape the script itself uses.
"tests/*" = ["S101", "E501", "S603", "S607"]
# Same reasoning for the live checks, which build the same throwaway git repos.
"integration/*" = ["S101", "E501", "S603", "S607"]

# ── mypy (static type checker) ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["skills/dependabot-audit/scripts", "tests", "integration"]
mypy_path = "skills/dependabot-audit/scripts"
strict = true
exclude = ["integration/fixtures"]

[[tool.mypy.overrides]]
# Test functions and their calls to each other are exempt, matching the policy
# in the repos this plugin audits. The script itself is checked under full
# strict, and passes.
# List each test module explicitly. A `test_*` wildcard silently matches
# nothing here — mypy's patterns work on dot-separated components — and the
# override then disappears with no warning, not even under
# --warn-unused-configs (tested: errors went 25 -> 175). Adding a test file
# means adding it here; forgetting is loud, which is the safer direction.
module = ["test_audit", "test_changelog", "test_ci_state", "test_cleanup", "test_discover", "test_gate_diff", "test_plugin_layout", "test_precommit", "test_skill_prose", "test_ruff_replay", "test_precommit_replay", "test_live_registry", "test_live_changelog_sources"]
disallow_untyped_defs = false
disallow_untyped_calls = false
